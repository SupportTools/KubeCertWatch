name: CI/CD - v1.0

on:
  push:
  pull_request:

jobs:
  Test:
    runs-on: ubuntu-latest

    # Fetch tier: Go modules and the two pinned analysis tools come from proxy.golang.org
    # with sum.golang.org verification (pinned + checksummed upstream). GitHub-hosted runner,
    # no internal mirror reachable; follow-up filed to move this job onto the self-hosted
    # pool / Athens (cluster-services-1493).
    env:
      STATICCHECK_VERSION: v0.8.2   # honnef.co/go/tools, needs Go >= 1.26
      GOSEC_VERSION: v2.30.0        # github.com/securego/gosec/v2, needs Go >= 1.26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The module says go 1.23; the pinned linters need a 1.26 toolchain to build.
          go-version: "1.26.3"
          cache: true

      - name: Install static analysis tools (pinned)
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed on:"; echo "${unformatted}"; exit 1
          fi

      - name: Go static analysis
        run: |
          go vet ./...
          staticcheck ./...

      - name: Dependency management
        run: |
          go mod verify
          go mod tidy -diff

      - name: Security scanning
        run: gosec ./...

      - name: Test (race + coverage)
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

  Build:
    needs: Test
    # Publishes supporttools/kubecertwatch:latest; only from main, never from a branch push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # BuildKit from the Harbor Docker Hub proxy, pinned by index digest (cluster-services-1487)
          driver-opts: image=harbor.support.tools/dockerhub/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build and push
        run: |
          docker buildx build \
          --platform linux/amd64 \
          --pull \
          --build-arg VERSION=v${{ github.run_number }} \
          --build-arg GIT_COMMIT=${{ github.sha }} \
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
          --cache-from supporttools/kubecertwatch:latest \
          -t supporttools/kubecertwatch:"v${{ github.run_number }}" \
          -t supporttools/kubecertwatch:latest \
          --push \
          -f Dockerfile .

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Update Helm dependencies
        run: |
          cd charts/KubeCertWatch
          helm dependency update

      - name: Helm Lint and Validate
        run: |
          # Basic lint check
          helm lint charts/KubeCertWatch/ --strict

          # Validate templates with different configurations
          helm template charts/KubeCertWatch/ --set cert-manager.enabled=true | kubectl validate
          helm template charts/KubeCertWatch/ --set cert-manager.enabled=false | kubectl validate

          # Validate RBAC rules
          helm template charts/KubeCertWatch/ -s templates/rbac.yaml | kubectl validate
          
          # Validate service account
          helm template charts/KubeCertWatch/ -s templates/serviceaccount.yaml | kubectl validate

      - name: Package Helm chart
        run: |
          export CHART_VERSION="1.0.${{ github.run_number }}"
          export APP_VERSION="1.0.${{ github.run_number }}"
          export IMAGE_TAG="1.0.${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          envsubst < charts/KubeCertWatch/Chart.yaml.template > charts/KubeCertWatch/Chart.yaml
          envsubst < charts/KubeCertWatch/values.yaml.template > charts/KubeCertWatch/values.yaml
          helm package charts/KubeCertWatch --destination helm/repo

      - name: Mint helm-chart repo token (GitHub App supporttools-chart-publisher)
        id: chart-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHART_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHART_APP_PRIVATE_KEY }}
          owner: SupportTools
          repositories: helm-chart,helm-chart-private

      - name: Checkout helm-chart repository
        uses: actions/checkout@v4
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ steps.chart-app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          cp helm/repo/KubeCertWatch-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for KubeCertWatch"
          git push
